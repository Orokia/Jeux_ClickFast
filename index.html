
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1 class="flex-center">ClickFast</h1>

        <p class="catchphrase">
          Sois le plus rapide des clickers du game ⚡
        </p>

        <label for="username">Ton pseudo</label>
        <input
          id="username"
          type="text"
          maxlength="50"
          placeholder="Entre ton pseudo"
          autocomplete="nickname"
        />

        <div class="number" id="score">0</div>

        <p class="catchphrase">
          Temps restant : <span id="timer">5</span> secondes
        </p>

        <div class="flex-center">
          <button id="button-clicker">
            Commencer
          </button>
        </div>

        <p id="message" class="catchphrase">
          Entre ton pseudo puis clique sur Commencer !
        </p>

        <section id="leaderboard">
          <h2>🏆 Meilleurs scores</h2>
          <p id="leaderboard-message">Chargement du classement...</p>
          <ol id="leaderboard-list"></ol>
        </section>
      </div>
    </div>
  </body>
</html>
