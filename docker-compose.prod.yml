
services:
  game:
    image: orokia/clickfast:1.3
    container_name: clickfast
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started
    networks:
      - clickfast-network

  api:
    image: orokia/clickfast-api:1.0
    container_name: clickfast-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clickfast
      DB_USER: clickfast
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clickfast-network

  stats-api:
    image: orokia/clickfast-stats-api:1.0
    container_name: clickfast-stats-api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clickfast
      DB_USER: clickfast
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clickfast-network

  db:
    image: postgres:17
    container_name: clickfast-db
    environment:
      POSTGRES_DB: clickfast
      POSTGRES_USER: clickfast
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - clickfast_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickfast -d clickfast"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - clickfast-network

  adminer:
    image: adminer:latest
    container_name: clickfast-adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clickfast-network

networks:
  clickfast-network:
    name: clickfast-network
    driver: bridge

volumes:
  clickfast_pgdata_v2:
    external: true
