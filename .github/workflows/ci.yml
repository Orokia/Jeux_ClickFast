name: ClickFast CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Vérifier la qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter ESLint
        run: npm run lint

  test:
    name: Exécuter les tests Jest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

  docker:
    name: Construire les images Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier Docker Compose
        run: docker compose config --quiet
        env:
          DB_PASSWORD: validation-only

      - name: Construire les images Docker
        run: |
          docker build -t clickfast:ci .
          docker build -t clickfast-api:ci ./api
          docker build -t clickfast-stats-api:ci ./stats-api

  publish:
    name: Publier les images sur Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image du site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: orokia/clickfast:${{ github.sha }}

      - name: Publier l'image de l'API Node.js
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: orokia/clickfast-api:${{ github.sha }}

      - name: Publier l'image de l'API statistiques
        uses: docker/build-push-action@v6
        with:
          context: ./stats-api
          file: ./stats-api/Dockerfile
          push: true
          tags: orokia/clickfast-stats-api:${{ github.sha }}
