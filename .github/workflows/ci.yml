name: ClickFast CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Vérifier la qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter ESLint
        run: npm run lint

  test:
    name: Exécuter les tests Jest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

  docker:
    name: Construire les images Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier Docker Compose
        run: docker compose config --quiet
        env:
          DB_PASSWORD: validation-only

      - name: Construire les images Docker
        run: |
          docker build -t clickfast:ci .
          docker build -t clickfast-api:ci ./api
          docker build -t clickfast-stats-api:ci ./stats-api

  publish:
    name: Publier les images sur Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image du site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: orokia/clickfast:${{ github.sha }}

      - name: Publier l'image de l'API Node.js
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: orokia/clickfast-api:${{ github.sha }}

      - name: Publier l'image de l'API statistiques
        uses: docker/build-push-action@v6
        with:
          context: ./stats-api
          file: ./stats-api/Dockerfile
          push: true
          tags: orokia/clickfast-stats-api:${{ github.sha }}
  deploy:
    name: Déployer ClickFast sur la VM
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Déployer sur la VM de production
        shell: powershell
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VM_SSH_PRIVATE_KEY)) {
            throw "Le secret VM_SSH_PRIVATE_KEY est absent."
          }

          if ([string]::IsNullOrWhiteSpace($env:VM_SSH_KNOWN_HOSTS)) {
            throw "Le secret VM_SSH_KNOWN_HOSTS est absent."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "deploy_key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "known_hosts"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          try {
            [System.IO.File]::WriteAllText(
              $keyPath,
              $env:VM_SSH_PRIVATE_KEY.Trim() + "`n",
              $utf8NoBom
            )

            [System.IO.File]::WriteAllText(
              $knownHostsPath,
              $env:VM_SSH_KNOWN_HOSTS.Trim() + "`n",
              $utf8NoBom
            )

            # (R,D) : lecture pour ssh, suppression pour le nettoyage du bloc finally.
            # Avec (R) seul, la clé restait dans _temp et bloquait les déploiements suivants.
            icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R,D)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Impossible de sécuriser les permissions de la clé SSH."
            }

            $remoteCommand = "IMAGE_TAG=$($env:IMAGE_TAG) docker compose --env-file /root/.env.prod -f /root/docker-compose.prod.yml up -d game api stats-api"

            ssh -i $keyPath `
              -p $env:VM_SSH_PORT `
              -o IdentitiesOnly=yes `
              -o StrictHostKeyChecking=yes `
              -o "UserKnownHostsFile=$knownHostsPath" `
              root@$env:VM_SSH_HOST `
              $remoteCommand

            if ($LASTEXITCODE -ne 0) {
              throw "Le déploiement SSH a échoué."
            }
          }
          finally {
            # File.Delete et non Remove-Item -Force, qui exige aussi le droit de modifier les attributs.
            foreach ($path in $keyPath, $knownHostsPath) {
              try { [System.IO.File]::Delete($path) } catch { }
            }
            if (Test-Path $keyPath) {
              Write-Warning "La clé SSH temporaire n'a pas pu être supprimée : $keyPath"
            }
          }
